<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sitemap | File Tree</title>
    <!-- FontAwesome -->
    
    <!-- Google Fonts: Syne, Outfit, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Outfit:wght@200;300;400;500;600;700;800;900&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">

    <!-- Global Styles -->
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/min/blog.min.css" />
    <link rel="stylesheet" href="/css/min/footer.min.css" />

    <style>
      /* Sitemap Specific Overrides */
      body {
        /* Handled by style.css but ensure un-hide on load */
        overflow: auto;
      }

      .sitemap-wrapper {
        max-width: 900px;
        margin: 0 auto;
        padding: 0 20px;
      }

      /* Tree Layout */
      .file-tree-container {
        font-family: "Fira Code", monospace;
        font-size: 0.95rem;
        background: var(--skeleton-base);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 30px;
        overflow-x: auto;
        margin-top: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .tree-branch {
        list-style: none;
        padding: 0;
        margin: 0;
        position: relative;
      }

      .tree-branch[style*="--level: 0"] > .tree-item > .tree-row > .tree-line {
        display: none; /* No lines for root level */
      }

      .tree-branch:not([style*="--level: 0"]) {
        padding-left: 24px;
        margin-left: -4px;
        border-left: 1px dotted var(--glass-border);
      }

      .tree-item {
        position: relative;
      }

      .tree-row {
        display: flex;
        align-items: center;
        padding: 8px 10px;
        border-radius: 6px;
        margin: 2px 0;
        transition:
          background 0.2s,
          transform 0.2s;
        position: relative;
      }

      .tree-row:hover {
        background-color: var(--glass-bg);
        transform: translateX(2px);
      }

      /* The horizontal branch line */
      .tree-line {
        position: absolute;
        left: -24px;
        top: 50%;
        width: 20px;
        border-top: 1px dotted var(--glass-border);
        z-index: 0;
      }

      /* Hide bottom tail of vertical line for last items */
      .tree-item.is-last > .tree-row::before {
        content: "";
        position: absolute;
        left: -25px;
        top: 50%;
        bottom: -200px; /* Cover any continuing border */
        width: 4px;
        background: var(--skeleton-base); /* Match container background */
        z-index: -1;
        transition: background 0.4s ease;
      }

      .tree-icon {
        margin-right: 12px;
        font-size: 1.1em;
        width: 16px;
        text-align: center;
        z-index: 1;
      }

      .directory {
        color: #d2a8ff;
      } /* Keeping vibrant colors for file icons */
      .html-file {
        color: #e34c26;
      }
      .xml-file {
        color: #2ea043;
      }

      .tree-label {
        color: var(--text-light);
        text-decoration: none;
        cursor: pointer;
        z-index: 1;
        transition: color 0.2s;
      }

      a.tree-label:hover {
        color: var(--accent-primary);
      }

      .project-root {
        display: flex;
        align-items: center;
        padding: 10px;
        font-weight: 600;
        color: var(--text-light);
        border-bottom: 1px solid var(--glass-border);
        margin-bottom: 15px;
        gap: 12px;
        font-size: 1.05rem;
      }
      .project-root i {
        color: var(--accent-primary);
      }

      .build-subtitle {
        color: var(--text-muted);
        font-family: "Fira Code", monospace;
        font-size: 0.9rem;
        text-align: center;
        margin-bottom: 40px;
      }
    </style>
    <script src="js/min/theme.min.js?v={{VERSION}}"></script>
    <script src="https://unpkg.com/lucide@0.460.0"></script>
    <script>window.lucide || document.write('<script src="js/min/lucide.min.js"><\/script>')</script>
</head>
  <body>
    <!-- Utility Toggles -->
    <div class="utility-toggles">
      <button
        id="themeToggle"
        class="theme-toggle"
        data-theme-toggle
        aria-label="Toggle Dark Mode"
      >
        <i data-lucide="moon"></i>
      </button>
    </div>

    <section class="blog-gallery-section" style="padding-top: 100px">
      <div class="sitemap-wrapper">
        <div class="blog-section-header">
          <h2 class="blog-title">
            <span
              class="blog-main-text"
              style="font-size: clamp(2rem, 5vw, 3.5rem)"
              ><i
                class="fa-solid fa-sitemap"
                style="color: var(--accent-primary); margin-right: 15px"
              ></i
              >Project Architecture</span
            >
            <span class="blog-ghost-text">Sitemap</span>
          </h2>
        </div>

        <div class="build-subtitle">
          Generated dynamically via build.js &bull; Directory Map
        </div>

        <div class="file-tree-container">
          <div class="project-root">
            <i data-lucide="globe"></i> www.sudo.co.za
          </div>
          {{FILE_TREE_HTML}}
        </div>

        <div style="text-align: center; margin-top: 60px">
          <a href="/index.html" class="lets-talk-btn">
            <span>Back to Home</span>
            <svg width="15px" height="10px" viewBox="0 0 13 10">
              <path d="M1,5 L11,5"></path>
              <polyline points="8 1 12 5 8 9"></polyline>
            </svg>
          </a>
        </div>
      </div>
    </section>

    <!-- INJECT_GLOBAL_FOOTER -->

    <!-- Theme & Icon Logic -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (window.ThemeSystem) window.ThemeSystem.init();
        if (typeof lucide !== "undefined" && typeof lucide.createIcons === "function") {
          lucide.createIcons();
        }
      });
      window.addEventListener("load", function () {
        if (typeof lucide !== "undefined" && typeof lucide.createIcons === "function") {
          lucide.createIcons();
        }
      });
    </script>

    <!-- ========================================= -->
    <!-- Back to Top                               -->
    <!-- ========================================= -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
      <i data-lucide="chevron-up"></i>
    </button>
  </body>
</html>
