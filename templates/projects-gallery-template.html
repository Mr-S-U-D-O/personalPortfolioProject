<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Gallery | Mosa Moleleki</title>
    <meta
      name="description"
      content="A showcase of web projects, interactive experiences, and digital solutions by Mosa Moleleki."
    />
    <link rel="canonical" href="https://mr-sudo.dev/projects.html" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mr-sudo.dev/projects.html" />
    <meta property="og:title" content="Project Gallery | Mosa Moleleki" />
    <!-- Google Fonts: Syne, Outfit, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Outfit:wght@200;300;400;500;600;700;800;900&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css?v={{VERSION}}" />
    <link rel="stylesheet" href="css/min/project.min.css?v={{VERSION}}" />
    <!-- Universal Theme System -->
    <script src="js/min/theme.min.js?v={{VERSION}}"></script>
    <link rel="stylesheet" href="css/min/footer.min.css?v={{VERSION}}" />
    <script src="https://unpkg.com/lucide@0.460.0"></script>
    <script>window.lucide || document.write('<script src="js/min/lucide.min.js"><\/script>')</script>
</head>
  <body class="projects-gallery-page">
    <!-- Premium Floating Nav -->
    <nav class="project-floating-nav animate-fade-in" style="z-index: 1000;">
        <div class="nav-inner glass-panel">
            <a href="index.html#projects" class="nav-back-btn">
                <div class="btn-icon-circle-small"><i data-lucide="arrow-left"></i></div>
                <span>Back to Projects</span>
            </a>
            <div class="nav-actions">
                <button class="theme-toggle" data-theme-toggle aria-label="Toggle Dark Mode">
                    <i data-lucide="moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <section class="gallery-section">
      <div class="gallery-header fade-element">
        <div class="projects-section-header">
          <span class="projects-subtitle">COLLECTION</span>
          <h2 class="projects-title">
            <span class="projects-main-text">Project Gallery</span>
            <span class="projects-ghost-text">Showcase</span>
          </h2>
        </div>

        <div class="gallery-search-container">
          <div class="search-box">
            <i data-lucide="search" class="search-icon"></i>
            <input
              type="text"
              id="gallerySearch"
              placeholder="Search projects by title, tech, or description..."
              aria-label="Search Projects"
            />
            <button
              id="clearSearch"
              class="clear-search-btn"
              aria-label="Clear Search"
            >
              <i data-lucide="x-circle"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="projects-stack glow-container" id="projectsStack">
        {{ALL_PROJECTS_CARDS_HTML}}
      </div>
    </section>

    <!-- Project Modal Integrated -->
    <div class="project-modal" id="projectModal">
      <div class="modal-backdrop"></div>
      <div class="modal-content-wrapper">
        <button
          class="modal-close-btn"
          id="modalCloseBtn"
          aria-label="Close Modal"
        >
          <i data-lucide="x"></i>
        </button>
        <div class="modal-image-container">
          <img src="" alt="Project Image" id="modalImage" />
        </div>
        <div class="modal-info">
          <span class="modal-category" id="modalCategory">Category</span>
          <h2 class="modal-title" id="modalTitle">Project Title</h2>
          <p class="modal-description" id="modalDescription">
            Project description goes here.
          </p>
          <div class="modal-tech-stack" id="modalTechStack"></div>
          <a href="#" class="lets-talk-btn" id="modalLink" style="margin-top: 2rem;">
            <span>See Details</span>
            <svg width="15px" height="10px" viewBox="0 0 13 10">
              <path d="M1,5 L11,5"></path>
              <polyline points="8 1 12 5 8 9"></polyline>
            </svg>
          </a>
        </div>
      </div>
    </div>

    <!-- INJECT_GLOBAL_FOOTER -->

    <script src="js/min/index.min.js?v={{VERSION}}" type="module"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (window.ThemeSystem) window.ThemeSystem.init();
        if (typeof lucide !== "undefined") lucide.createIcons();

        // Re-initialize the glow effect for statically rendered cards
        document.addEventListener("pointermove", (e) => {
          const container = e.target.closest(".glow-container");
          if (container) {
            container.querySelectorAll(".glow-card").forEach((card) => {
              const rect = card.getBoundingClientRect();
              card.style.setProperty("--x", e.clientX - rect.left + "px");
              card.style.setProperty("--y", e.clientY - rect.top + "px");
            });
          }
        });

        // Video hover logic for static cards
        const projectCards = document.querySelectorAll(".project-row");
        projectCards.forEach((card) => {
          const img = card.querySelector(".project-row-img");
          const video = card.querySelector(".project-row-video");

          if (video) {
            card.addEventListener("mouseenter", () => {
              if (window.innerWidth >= 992) {
                video.play().catch(console.error);
                img.style.opacity = "0";
                video.style.opacity = "1";
              }
            });
            card.addEventListener("mouseleave", () => {
              if (window.innerWidth >= 992) {
                video.pause();
                video.currentTime = 0;
                img.style.opacity = "1";
                video.style.opacity = "0";
              }
            });
          }
        });
        if (window.lucide && typeof lucide.createIcons === "function") {
          lucide.createIcons();
        }
      });
      window.addEventListener("load", () => {
        if (window.lucide && typeof lucide.createIcons === "function") {
          lucide.createIcons();
        }
      });
    </script>

    <!-- ========================================= -->
    <!-- Back to Top                               -->
    <!-- ========================================= -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
      <i data-lucide="chevron-up"></i>
    </button>
  </body>
</html>
